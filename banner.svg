<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0c4a6e;#0f172a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2E97F7">
        <animate attributeName="stop-color" values="#2E97F7;#8A2BE2;#06b6d4;#2E97F7" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- floating glow orbs -->
    <circle cx="140" cy="60" r="90" fill="#ffffff" opacity="0.06">
      <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="190" r="120" fill="#ffffff" opacity="0.05">
      <animate attributeName="cy" values="190;150;190" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves -->
    <path d="M0 200 Q 125 160 250 200 T 500 200 T 750 200 T 1000 200 V260 H0Z" fill="#ffffff" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="0 0;-250 0;0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 220 Q 125 190 250 220 T 500 220 T 750 220 T 1000 220 V260 H0Z" fill="#ffffff" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" values="-250 0;0 0;-250 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 240 Q 125 220 250 240 T 500 240 T 750 240 T 1000 240 V260 H0Z" fill="#ffffff" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0;-250 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text x="500" y="115" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#text)">
      Armaghan
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#e0f2fe" letter-spacing="3">
      AI &amp; BACKEND ENGINEER
      <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#bae6fd" opacity="0.9">
      Smart Models. Solid Systems.
    </text>
  </g>
</svg>
